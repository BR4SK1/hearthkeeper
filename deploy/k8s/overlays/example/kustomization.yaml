apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hearthkeeper
resources:
  - ../../base
images:
  - name: hearthkeeper/gm
    newName: ghcr.io/OWNER/hearthkeeper-gm
    newTag: latest
  - name: hearthkeeper/client
    newName: ghcr.io/OWNER/hearthkeeper-client
    newTag: latest
patches:
  - path: ingress-host.json
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: hearthkeeper
  - path: gm-settings.yaml
